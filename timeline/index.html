<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline：皇帝与教皇 · 第六章年表</title>
<meta name="description" content="基于《The Shortest History of Europe》第六章的年表排序游戏：把 41 张历史卡牌放进正确的时间缝隙。">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ============ 视图：首页 ============ -->
  <section class="view" id="view-home">
    <header class="home-head">
      <div class="brand" id="brand" title="Timeline：皇帝与教皇">
        <span class="brand-mark">⏳</span>
        <h1>Timeline · 皇帝与教皇</h1>
        <p class="sub">The Shortest History of Europe · 第六章 · 年表排序</p>
      </div>
      <div class="progress-card">
        <div class="prog-row">
          <span class="prog-label">收集</span>
          <span class="prog-value"><b id="home-collected">0</b> / <span id="home-total">0</span></span>
        </div>
        <div class="bar"><i id="home-collect-bar" style="width:0%"></i></div>
        <div class="act-rings" id="home-rings"></div>
      </div>
    </header>

    <div class="mode-list">
      <button class="mode big" data-go="acts">
        <span class="mode-icon">🎬</span>
        <span class="mode-txt"><b>闯关模式</b><small>四幕推进 · 每幕一套规则</small></span>
        <span class="mode-arrow">›</span>
      </button>
      <!-- 终章（第五幕）：通关全部四幕 / 打开测试口子后才显示，由 renderHome() 控制 -->
      <button class="mode finale" id="home-finale" hidden>
        <span class="mode-icon">🏛</span>
        <span class="mode-txt"><b>终章 · 全部卡牌</b><small id="home-finale-hint">四幕已通关 · 全部 41 张卡，一条完整时间线</small></span>
        <span class="mode-arrow">›</span>
      </button>
      <button class="mode" data-go="review">
        <span class="mode-icon">🔁</span>
        <span class="mode-txt"><b>复习模式</b><small id="review-hint">错题优先 · 间隔重复</small></span>
        <span class="mode-arrow">›</span>
      </button>
      <button class="mode" data-go="gallery">
        <span class="mode-icon">🗂</span>
        <span class="mode-txt"><b>卡册</b><small id="gallery-hint">翻翻这套 41 张纪念卡</small></span>
        <span class="mode-arrow">›</span>
      </button>
    </div>

    <!-- 难度选择已移除：失误预算、大小时间段、势力显隐等规则直接绑定在
         每一幕上（见 app.js 的 ACT_RULES），玩家进哪一幕就用哪一套规则。 -->
    <div class="home-links">
      <a class="sister" href="../index.html">
        <span>姊妹作</span>
        <b>《皇帝与教皇 · 权力的双人舞》</b>
        <small>先去亲历一遍抉择，再回来排年表 →</small>
      </a>
      <div class="home-foot">
        <button class="link-btn" id="btn-reset">清空存档</button>
        <span class="dot">·</span>
        <button class="link-btn" id="btn-help">玩法说明</button>
      </div>
    </div>
  </section>

  <!-- ============ 视图：幕选择 ============ -->
  <section class="view" id="view-acts">
    <div class="topbar">
      <button class="back" data-go="home">‹ 返回</button>
      <h2>选择一幕</h2>
      <span class="topbar-right" id="acts-progress"></span>
    </div>
    <div class="act-list" id="act-list"></div>
    <!-- 测试口子：连点本页标题「选择一幕」5 次后出现，一键直接开第五幕；
         测试模式下幕列表里第二 / 三 / 四幕同样可直接点进去玩 -->
    <button class="act5-test-btn" id="act5-test-btn" type="button" hidden>🧪 测试：直接开启第五幕（全部 41 张）</button>
  </section>

  <!-- ============ 视图：对局 ============ -->
  <section class="view" id="view-game">
    <div class="game-head">
      <button class="back" id="game-quit">‹ 退出</button>
      <div class="game-title">
        <div class="title-row">
          <b id="game-act-name">第一幕</b>
          <!-- 关卡难度名（抄录 / 考据 / 编年 / 立传）；终章与复习局隐藏 -->
          <span class="game-diff" id="game-diff" hidden></span>
          <!-- 缩放滑条：就地拖动、即时生效、松手即存。省掉「开面板 → 拖 → 点完成」两道环节。 -->
          <div class="zoom-inline" id="zoom-inline" role="group" aria-label="卡片显示比例">
            <label class="zi-item" title="时间线卡牌显示比例（双击恢复默认）">
              <span class="zi-tag">时间线</span>
              <input type="range" id="zi-tl" min="0.5" max="1.5" step="0.02" value="1"
                     aria-label="时间线卡牌显示比例">
              <output class="zi-val" id="zi-tl-v">×1.00</output>
            </label>
            <label class="zi-item" title="手牌显示比例（双击恢复默认）">
              <span class="zi-tag">手牌</span>
              <input type="range" id="zi-hand" min="0.5" max="1.5" step="0.02" value="1"
                     aria-label="手牌显示比例">
              <output class="zi-val" id="zi-hand-v">×1.00</output>
            </label>
            <button class="zi-reset" id="zi-reset" type="button" title="两排都恢复本屏幕的默认比例"
                    aria-label="恢复默认比例">↺</button>
          </div>
        </div>
        <small id="game-act-span"></small>
      </div>
      <div class="hud">
        <div class="hud-item" title="失误预算"><span id="hud-mistakes"></span></div>
        <div class="hud-item" id="hud-combo-box" title="连击"><span id="hud-combo">🔥 0</span></div>
        <div class="hud-item" title="进度"><span id="hud-progress">0/0</span></div>
      </div>
    </div>

    <!-- 通关后先停在对局页：独立条带，不放在 .timeline-wrap 内，
         否则手机横屏的两排缩放会把确认按钮一起缩小，不好点。就地展开、不遮挡时间线。 -->
    <div class="win-bar" id="win-bar" aria-live="polite">
      <div class="win-txt">
        <b>✓ 这一幕的时间线排完了</b>
        <span>先翻一翻整条时间线，看看这段历史怎么连起来的，再继续。</span>
      </div>
      <button type="button" id="win-confirm">完成，看结果 ›</button>
    </div>

    <div class="timeline-wrap">
      <!-- 提示行：全对局唯一的信息源，固定单行高度。放对/放错直接替换这里的文字并
           一直保留，直到玩家再次点选一张手牌才更新；不再新增或收起任何一行。
           「详情」按需展开底部完整讲解条，不锁流程、不改画面高度。 -->
      <div class="timeline-hint" id="timeline-hint" aria-live="polite">点一张手牌，再点亮起的插入位</div>
      <!-- 两级纪元带：账号级全局开关（第一次打到第三幕才解锁）与本局关卡规则
           era 开关都满足、且不是手机竖屏时才显示（空间小、减信息量）。
           解锁前连复习局都不出现；解锁后某段首次达标会从新增卡牌上方淡入、位移到所属区间后才正式点亮；
           大段跟随段内首个达标小段一起触发，之后不再变化。
           鼠标悬停 / 触屏点选已点亮的段，可让该段时间线卡牌按原生 hover 效果浮起。
           动画不因系统「减少动态效果」而降级，保证 Windows / Mac 观感一致。
           上层大周期 / 中层世纪小段由 eras.js + app.js 渲染；
           第三层 #era-life-band 是未来人物生命带的空容器，本轮预留、不用。 -->
      <div class="era-band" id="era-band">
        <div class="era-row era-row-big" id="era-big"></div>
        <div class="era-row era-row-small" id="era-small"></div>
        <div class="era-life" id="era-life-band"></div>
      </div>
      <div class="tl-axis"><span>← 更早</span><b id="tl-count">时间线 · 1 张</b><span>更晚 →</span></div>
      <button class="tl-nav tl-nav-l" id="tl-nav-l" type="button" aria-label="看更早的卡片" hidden>‹</button>
      <button class="tl-nav tl-nav-r" id="tl-nav-r" type="button" aria-label="看更晚的卡片" hidden>›</button>
      <div class="timeline" id="timeline"></div>
      <!-- 第四幕人物线：与事件时间线平行的一排圆头像。每个人物以出生年为锚点，
           在上排事件序列里占一个「虚拟半卡位」（不实际插入事件卡序列），由金色
           虚线挂到事件线上；两个人物之间夹着事件卡时，两排会一起重新拉开间距。
           只在第四幕启用，其余关卡零节点、零占位（hidden）。 -->
      <div class="people-line" id="people-line" hidden></div>
    </div>

    <div class="hand-wrap">
      <div class="hand-label" id="hand-label">手牌 <small>（年份未知，点选后放入缝隙）</small></div>
      <div class="hand" id="hand"></div>
    </div>
  </section>

  <!-- ============ 视图：幕终结算 ============ -->
  <section class="view" id="view-result">
    <div class="result-card" id="result-card"></div>
  </section>

  <!-- ============ 视图：复习模式 ============ -->
  <section class="view" id="view-review">
    <div class="topbar">
      <button class="back" data-go="home">‹ 返回</button>
      <h2>复习模式</h2>
      <span class="topbar-right" id="review-count"></span>
    </div>
    <div class="review-body" id="review-body"></div>
  </section>

  <!-- ============ 视图：卡册 ============ -->
  <section class="view" id="view-gallery">
    <div class="topbar">
      <button class="back" data-go="home">‹ 返回</button>
      <h2>卡册</h2>
      <span class="topbar-right" id="gallery-count"></span>
    </div>
    <div class="gallery-tabs" id="gallery-tabs"></div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </section>

  <!-- ============ 视图：卡牌编辑器（隐藏入口） ============ -->
  <section class="view" id="view-editor">
    <div class="topbar">
      <button class="back" data-go="home">‹ 返回</button>
      <h2>卡牌编辑器 <small class="tag">隐藏</small></h2>
      <span class="topbar-right" id="editor-count"></span>
    </div>
    <!-- 缩放已改成对局页标题后的就地滑条，这里只留一个「跳到对局页看滑条」的说明位 -->
    <p class="zp-entry" id="zp-entry">卡片显示比例已挪到对局页标题后：两根滑条分别控制时间线卡与手牌，拖动即时生效。</p>
    <div class="editor-body" id="editor-body"></div>
  </section>

</div>

<!-- 判定反馈条 -->
<div class="feedback" id="feedback" aria-live="polite">
  <div class="fb-inner">
    <div class="fb-head">
      <span class="fb-verdict" id="fb-verdict"></span>
      <span class="fb-year" id="fb-year"></span>
      <button class="fb-close" id="fb-close">✕</button>
    </div>
    <div class="fb-event" id="fb-event"></div>
    <div class="fb-explain" id="fb-explain"></div>
    <div class="fb-quote" id="fb-quote"></div>
    <div class="fb-actions">
      <button class="fb-btn" id="fb-src-btn">📖 书中原文</button>
      <button class="fb-btn" id="fb-audio-btn">🔊 原声</button>
      <button class="fb-btn primary" id="fb-next">继续</button>
    </div>
    <div class="fb-src" id="fb-src"></div>
  </div>
</div>

<!-- 大卡 / 详情弹窗 -->
<div class="modal" id="modal">
  <div class="modal-mask" id="modal-mask"></div>
  <div class="modal-box" id="modal-box"></div>
</div>

<div class="toast" id="toast"></div>

<script src="cards.js"></script>
<script src="people-cards.js"></script>
<script src="engine.js"></script>
<script src="eras.js"></script>
<script src="app.js"></script>
</body>
</html>
